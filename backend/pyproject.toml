[project]
name = "personal-ai-assistant-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the Personal AI Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
]

[project.optional-dependencies]
# Install only the provider you actually use, e.g. `pip install -e ".[openai]"`.
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
